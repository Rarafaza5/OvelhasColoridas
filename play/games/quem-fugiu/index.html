<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quem Fugiu?</title><script src="../../oc.js"></script>
<style>
body{background:radial-gradient(circle at 50% 0,#3a1a6a,#0a0e27);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 12px 12px;touch-action:manipulation}
#msg{font:700 1.35rem Fredoka,sans-serif;text-align:center;min-height:32px;color:#00f5d4}
.tbar{width:min(94vw,560px);height:10px;border-radius:99px;background:#ffffff1a;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00f5d4,#ffd166,#ff85a2);transition:width .25s linear}
.field{position:relative;width:min(94vw,560px);height:min(45vh,320px);border-radius:28px;background:radial-gradient(circle at 50% 80%,#184e68,#121c4e 75%);border:3px solid #ffffff33;overflow:hidden;box-shadow:0 16px 40px #0009}
.sp{position:absolute;width:18%;aspect-ratio:1;transition:left .55s cubic-bezier(.34,1.56,.64,1),top .55s cubic-bezier(.34,1.56,.64,1),opacity .35s,transform .35s;display:flex;align-items:center;justify-content:center}
.sp img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px #0009);animation:bn 1.1s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(-7px)}}
.sp.gone{opacity:0;transform:scale(.1) rotate(40deg)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:620px}
.o{width:68px;height:68px;border-radius:20px;background:#151c4a;border:3px solid #ffffff33;cursor:pointer;padding:5px;transition:.15s;box-shadow:0 6px 16px #0006}
.o:hover{transform:translateY(-3px);border-color:#ffd166}.o:active{transform:scale(.9)}
.o img{width:100%;height:100%;object-fit:contain}.o.ok{background:#06d6a0;border-color:#fff}.o.no{background:#ef476f;border-color:#fff}
.curtain{position:absolute;inset:0;background:linear-gradient(180deg,#2a1658,#0c102e);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 1.4rem Fredoka,sans-serif;color:#ffd166;transform:translateY(-102%);transition:transform .38s cubic-bezier(.4,0,.2,1);z-index:3}
.curtain b{font-size:4.2rem}
.curtain.on{transform:none}
</style></head><body>
<div class="hud"><span id="lv">🕵️ Nível 1</span><span id="sc">⭐ 0</span><span id="lf">❤️❤️❤️</span></div>
<div id="msg">Prepara os teus olhos de detetive!</div>
<div class="tbar"><i id="tb"></i></div>
<div class="field" id="f"><div class="curtain" id="cu"><b>🙈</b><span>Uma ovelha está a fugir...</span></div></div>
<div class="opts" id="opts"></div>
<div class="ov" id="ov"><h2>🕵️ Quem Fugiu?</h2>
<p>Observa com muita atenção todas as personagens no campo! Quando a cortina fechar, uma delas vai desaparecer e as outras vão trocar de lugar.<br>
Toca na personagem que fugiu!</p>
<button class="btn" id="go">▶ Começar Investigação</button></div>
<script>
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const ALL=[...OC.SHEEP.map(n=>'ovelha-'+n),'elefante-amendoim','pato'];
let lv=1,lives=3,score=0,streak=0,gone,locked=true,ids;
const sh=a=>[...a].sort(()=>Math.random()-.5);
const pos=n=>{
 const cols=Math.min(5,n),res=[];
 for(let i=0;i<n;i++)res.push([7+(i%cols)*(18+(100-18*cols-14)/Math.max(1,cols-1)),10+Math.floor(i/cols)*42+(i%2)*7]);
 return res;
};
function place(el,p){el.style.left=p[0]+'%';el.style.top=p[1]+'%'}
async function round(){
 const campLv=(OC.diff&&OC.diff.level)||1;
 const goalRounds=6+Math.min(6,Math.floor(campLv/8));
 locked=true;$('lv').textContent=`🕵️ Ronda ${lv}/${goalRounds} (Nv.${campLv})`;$('sc').textContent='⭐ '+score+(streak>1?` 🔥x${streak}`:'');
 $('lf').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('opts').innerHTML='';
 const n=Math.min(9,lv+2+Math.floor(campLv/15));ids=sh(ALL).slice(0,n);gone=ids[Math.floor(Math.random()*n)];
 [...$('f').querySelectorAll('.sp')].forEach(e=>e.remove());
 const ps=sh(pos(n)),els=ids.map((id,i)=>{
  const e=document.createElement('div');e.className='sp';e.innerHTML=`<img src="${OC.A}${id}.png">`;
  place(e,ps[i]);$('f').insertBefore(e,$('cu'));return e;
 });
 const T=Math.max(2200,4600-lv*250),steps=20;
 for(let i=steps;i>=0;i--){
  $('tb').style.width=(i/steps*100)+'%';
  $('msg').textContent=`👀 Memoriza o rebanho! (${Math.ceil(i*T/steps/1000)}s)`;
  await wait(T/steps);
 }
 $('cu').classList.add('on');OC.tone(300,.15,'sine',.08,0,180);await wait(520);
 els[ids.indexOf(gone)].classList.add('gone');
 if(lv>=2){const np=sh(pos(n));els.forEach((e,i)=>place(e,np[i]))}
 await wait(350);$('cu').classList.remove('on');OC.sfx.pop();
 $('msg').textContent='🕵️ Quem desapareceu do rebanho?';$('tb').style.width='100%';
 sh(ids).forEach(id=>{
  const b=document.createElement('div');b.className='o';b.innerHTML=`<img src="${OC.A}${id}.png">`;
  b.onclick=()=>pick(b,id);$('opts').appendChild(b);
 });
 locked=false;
}
async function pick(b,id){
 if(locked)return;locked=true;
 if(id===gone){
  b.classList.add('ok');streak++;const pts=10*streak;score+=pts;lv++;
  OC.sfx.good();$('msg').textContent=`🎉 Acertaste em cheio! +${pts} pts`;
 }else{
  b.classList.add('no');streak=0;lives--;
  [...$('opts').children].forEach(el=>{if(el.querySelector('img').src.includes(gone))el.classList.add('ok')});
  OC.sfx.bad();$('msg').textContent='😅 Ups, foi outra que fugiu!';
 }
 const g=$('f').querySelector('.sp.gone');if(g)g.classList.remove('gone');
 await wait(1350);
 const campLv=(OC.diff&&OC.diff.level)||1;
 const goalRounds=6+Math.min(6,Math.floor(campLv/8));
 if(lives<=0||lv>goalRounds){
  OC.best('quem-fugiu',score);
  const won=lv>goalRounds||lv>=5;
  OC.end({id:'quem-fugiu',win:won,title:won?'Super Detetive Estelar!':'Fim da investigação!',text:`Chegaste à ronda ${lv-1}/${goalRounds} do Nível ${campLv} com ${score} pontos!`,stars:lives===3?3:2,score,retry:start});
 }else round();
}
function start(){lv=1;lives=3;score=0;streak=0;round()}
$('go').onclick=()=>{$('ov').style.display='none';start()};
</script></body></html>
