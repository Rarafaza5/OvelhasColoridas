<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tear de Constelações</title><script src="../../oc.js"></script></head><body>
<canvas id="c"></canvas>
<div class="hud"><span id="hs">⭐ 0</span><span id="ht">⏱ 45s</span><span id="hb"></span></div>
<div class="ov" id="ov"><h2>🕸️ Tear de Constelações</h2>
<p>Liga ovelhas da mesma cor com fios de luz para fechares um <b>polígono mágico</b> (triângulo ou maior)!<br>
✨ Tudo o que ficar <b>dentro do laço</b> transforma-se em lã dourada! Mas cuidado: se uma sombra cósmica 👾 estiver lá dentro, o fio parte-se.</p>
<button class="btn" id="go">▶ Tecer Estrelas</button></div>
<script>
const W=720,H=480,cv=document.getElementById('c'),x=cv.getContext('2d'),P=OC.fit(cv,W,H);
const ID='ovelha-ninja',TAU=Math.PI*2,$=id=>document.getElementById(id);
const IM=OC.SHEEP.map(n=>OC.img('ovelha-'+n));
let nodes,hazards,chain,parts,pops,score,tl,running=false,over=false,t=0,shake=0,best=OC.best(ID);
$('hb').textContent='🏆 '+best;
function init(){
 nodes=[];hazards=[];chain=[];parts=[];pops=[];score=0;tl=45;over=false;
 for(let i=0;i<14;i++)spawnNode();
 for(let i=0;i<3;i++)hazards.push({x:120+Math.random()*(W-240),y:100+Math.random()*(H-200),vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90});
 upd();
}
function spawnNode(){
 const c=Math.floor(Math.random()*4); // 4 cores para facilitar triângulos
 nodes.push({x:70+Math.random()*(W-140),y:75+Math.random()*(H-140),vx:(Math.random()-.5)*35,vy:(Math.random()-.5)*35,c});
}
function upd(){$('hs').textContent='⭐ '+score;$('ht').textContent='⏱ '+Math.ceil(tl)+'s';$('hb').textContent='🏆 '+Math.max(best,score)}
function inPoly(px,py,poly){
 let inside=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
  if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi+.0001)+xi))inside=!inside;
 }
 return inside;
}
function burst(px,py,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=40+Math.random()*160;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,m:.5,c,r:3+Math.random()*3})}}
function closeChain(){
 if(chain.length<3){chain=[];return}
 // verifica se há alguma sombra dentro do polígono
 for(const h of hazards){
  if(inPoly(h.x,h.y,chain)){
   shake=10;OC.sfx.bad();pops.push({s:'💥 Sombra no laço!',x:h.x,y:h.y,l:.9,c:'#ef476f'});
   chain=[];return;
  }
 }
 // captura todas as ovelhas da cadeia + ovelhas no interior!
 const captured=new Set(chain);
 for(const n of nodes)if(inPoly(n.x,n.y,chain))captured.add(n);
 const cnt=captured.size,pts=cnt*cnt*10;
 score+=pts;tl=Math.min(60,tl+2.5);
 const col=OC.COLORS[OC.SHEEP[chain[0].c]];
 captured.forEach(n=>{n.dead=true;burst(n.x,n.y,col,10);spawnNode()});
 nodes=nodes.filter(n=>!n.dead);
 pops.push({s:`✨ CONSTELAÇÃO x${cnt}! +${pts}`,x:chain[0].x,y:chain[0].y-20,l:1.1,c:'#ffd166'});
 OC.sfx.good();chain=[];upd();
}
function update(dt){
 t+=dt;shake=Math.max(0,shake-dt*30);
 if(!running||over)return;
 tl-=dt;
 if(tl<=0){
  over=true;running=false;OC.best(ID,score);best=OC.best(ID);
  setTimeout(()=>OC.end({id:ID,title:'Constelações Tecidas!',text:`Teceste ${score} pontos de luz estelar! Recorde: ${best}.`,stars:Math.max(1,Math.ceil(score/120)),retry:()=>{init();running=true}}),500);
  return;
 }
 for(const n of nodes){
  n.x+=n.vx*dt;n.y+=n.vy*dt;
  if(n.x<45||n.x>W-45)n.vx*=-1;
  if(n.y<60||n.y>H-45)n.vy*=-1;
 }
 for(const h of hazards){
  h.x+=h.vx*dt;h.y+=h.vy*dt;
  if(h.x<50||h.x>W-50)h.vx*=-1;
  if(h.y<65||h.y>H-50)h.vy*=-1;
 }
 if(Math.floor(t*4)%2===0)upd();
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 pops.forEach(p=>{p.y-=35*dt;p.l-=dt});pops=pops.filter(p=>p.l>0);
}
function draw(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1338');g.addColorStop(1,'#261552');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 if(chain.length>1){
  const col=OC.COLORS[OC.SHEEP[chain[0].c]];
  x.fillStyle=col+'33';x.strokeStyle=col;x.lineWidth=4;
  x.beginPath();chain.forEach((n,i)=>i?x.lineTo(n.x,n.y):x.moveTo(n.x,n.y));x.closePath();
  if(chain.length>=3)x.fill();
  x.stroke();
 }
 for(const n of nodes){
  const col=OC.COLORS[OC.SHEEP[n.c]],sel=chain.includes(n);
  x.fillStyle=col+(sel?'ff':'55');x.strokeStyle=sel?'#ffd166':col;x.lineWidth=sel?4:2;
  x.beginPath();x.arc(n.x,n.y,24,0,TAU);x.fill();x.stroke();
  if(IM[n.c].complete)x.drawImage(IM[n.c],n.x-22,n.y-22,44,44);
 }
 x.font='30px sans-serif';x.textAlign='center';x.textBaseline='middle';
 hazards.forEach(h=>x.fillText('👾',h.x,h.y));
 for(const p of parts){x.globalAlpha=Math.max(0,p.l/p.m);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill()}x.globalAlpha=1;
 x.font='700 20px Fredoka,sans-serif';
 for(const p of pops){x.globalAlpha=Math.min(1,p.l*2);x.fillStyle=p.c;x.strokeStyle='#000a';x.lineWidth=3;x.strokeText(p.s,p.x,p.y);x.fillText(p.s,p.x,p.y)}x.globalAlpha=1;
 x.restore();
}
function pickAt(p){
 for(const n of nodes){
  if(Math.hypot(p.x-n.x,p.y-n.y)<30){
   if(!chain.length){chain.push(n);OC.tone(440,.07,'triangle')}
   else if(n.c===chain[0].c&&!chain.includes(n)){chain.push(n);OC.tone(440+chain.length*90,.07,'triangle')}
   else if(chain.length>=3&&n===chain[0])closeChain();
  }
 }
}
let down=false;
cv.addEventListener('pointerdown',e=>{down=true;chain=[];pickAt(P(e));try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(down)pickAt(P(e))});
addEventListener('pointerup',()=>{if(down){down=false;closeChain()}});
init();
let last=performance.now();
(function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
$('go').onclick=()=>{$('ov').style.display='none';running=true};
</script></body></html>
