<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Roda das Cores</title>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">🌟 <span id="sc">0</span></div>
  <div class="pill">🔥 Combo: <span id="cb">x1</span></div>
  <div class="pill">❤️ <span id="hp">3</span></div>
</div>
<div class="ov" id="st">
  <div class="card">
    <div style="font-size:3.2rem">🎡🌈</div>
    <h1>Roda das Cores</h1>
    <p>As 6 Ovelhas Coloridas protegem o Planeta Lã! Roda o planeta com as <b>Setas</b>, <b>Rato</b> ou <b>Toque</b> para alinhar a ovelha da mesma cor com os cometas de tinta que caem do espaço!</p>
    <div class="kbs"><span class="kb">◀ ▶ / A D</span> Rodar Planeta <span class="kb">Rato / Toque</span> Apontar Ângulo</div>
    <br><button class="btn" id="go">Rodar Planeta!</button>
  </div>
</div>
<script src="../../oc.js"></script>
<script>
const {c,ctx}=OC.canvas();
const SEGS=[
  {name:'Azul',col:'#4FC3F7',img:OC.img('ovelha-azul.png')},
  {name:'Rosa',col:'#F06292',img:OC.img('ovelha-rosa.png')},
  {name:'Verde',col:'#81C784',img:OC.img('ovelha-verde.png')},
  {name:'Roxa',col:'#BA68C8',img:OC.img('ovelha-roxa.png')},
  {name:'Laranja',col:'#FFB74D',img:OC.img('ovelha-laranja.png')},
  {name:'Melancia',col:'#FF5252',img:OC.img('ovelha-melancia.png')}
];
const imgRainbow=OC.img('ovelha-arcoiris.png');

let st='wait',sc=0,combo=1,hp=3,wheelAng=0,targetAng=null;
let keys={l:0,r:0},comets=[],spawnT=0;

function init(){
  sc=0;combo=1;hp=3;wheelAng=0;targetAng=null;
  comets=[];spawnT=0.6;
  document.getElementById('sc').textContent='0';
  document.getElementById('cb').textContent='x1';
  document.getElementById('hp').textContent='3';
}

window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=1;targetAng=null;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=1;targetAng=null;}
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;
});

let dragging=false,lastPtrAng=0;
c.addEventListener('pointerdown',e=>{
  dragging=true;
  lastPtrAng=Math.atan2(e.clientY-c.height/2,e.clientX-c.width/2);
});
window.addEventListener('pointermove',e=>{
  if(!dragging||st!=='play')return;
  const a=Math.atan2(e.clientY-c.height/2,e.clientX-c.width/2);
  let diff=a-lastPtrAng;
  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;
  wheelAng+=diff;
  lastPtrAng=a;
});
window.addEventListener('pointerup',()=>{dragging=false;});

function spawnComet(){
  const W=c.width,H=c.height,R=Math.hypot(W,H)*0.55;
  const ang=Math.random()*Math.PI*2;
  const idx=Math.floor(Math.random()*SEGS.length);
  const rainbow=Math.random()<0.12;
  const spd=115+Math.min(130,sc*1.1);
  comets.push({
    x:W/2+Math.cos(ang)*R,
    y:H/2+Math.sin(ang)*R,
    ang,dist:R,spd,idx,rainbow
  });
}

document.getElementById('go').onclick=()=>{
  document.getElementById('st').classList.add('hide');
  OC.music.start();init();st='play';
};

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const W=c.width,H=c.height,cx=W/2,cy=H/2;
  const planetR=Math.min(W,H)*0.19;
  OC.fx.drawStars(ctx,W,H,now);

  if(st==='play'){
    if(keys.l)wheelAng-=3.6*dt;
    if(keys.r)wheelAng+=3.6*dt;

    spawnT-=dt;
    if(spawnT<=0){
      spawnComet();
      spawnT=Math.max(0.65,1.55-sc*0.008);
    }

    for(let i=comets.length-1;i>=0;i--){
      const cm=comets[i];
      cm.dist-=cm.spd*dt;
      cm.x=cx+Math.cos(cm.ang)*cm.dist;
      cm.y=cy+Math.sin(cm.ang)*cm.dist;

      if(cm.dist<=planetR+26){
        // Determine which segment is at cm.ang
        let rel=(cm.ang-wheelAng)%(Math.PI*2);
        if(rel<0)rel+=Math.PI*2;
        const segIdx=Math.floor(rel/(Math.PI*2/6))%6;
        if(cm.rainbow || segIdx===cm.idx){
          const pts=Math.round(10*combo*(OC.diff?OC.diff.mult:1));
          sc+=pts;
          combo=Math.min(10,combo+1);
          const goalScore=160+((OC.diff&&OC.diff.level)||1)*35;
          document.getElementById('sc').textContent=`${sc}/${goalScore} (Nv.${OC.diff.level})`;
          document.getElementById('cb').textContent='x'+combo;
          OC.sfx.coin();
          OC.fx.burst(cm.x,cm.y,cm.rainbow?'#FFD93D':SEGS[cm.idx].col,18);
          OC.fx.floatText(cm.x,cm.y,`+${pts}`,'#FFD93D');
          if(sc>=goalScore){
            st='end';
            OC.end({win:true,stars:hp===3?3:2,score:sc,title:'Planeta Cromático Completo!',msg:`Atingiste a meta de ${goalScore} pontos do Nível ${OC.diff.level}!`,onRetry:()=>{init();st='play';}});
          }
        }else{
          combo=1;
          hp--;
          document.getElementById('cb').textContent='x1';
          document.getElementById('hp').textContent=hp;
          OC.sfx.hit();
          OC.fx.shake(12);
          OC.fx.burst(cm.x,cm.y,'#FF5252',22);
          if(hp<=0){
            st='end';
            OC.end({win:sc>=120,stars:sc>=350?3:sc>=180?2:1,score:sc,title:sc>=120?'Guardião da Roda!':'Planeta Descolorido!',msg:`Alinhaste os cometas com ${sc} pontos de harmonia cromática!`,onRetry:()=>{init();st='play';}});
          }
        }
        comets.splice(i,1);
      }
    }
  }

  // Draw incoming comets & guide lines
  for(const cm of comets){
    const col=cm.rainbow?'#FFD93D':SEGS[cm.idx].col;
    ctx.save();
    ctx.strokeStyle=col+'44';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(cm.x,cm.y);ctx.lineTo(cx,cy);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(cm.x,cm.y,17,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    if(cm.rainbow){
      ctx.drawImage(imgRainbow,cm.x-15,cm.y-15,30,30);
    }
    ctx.restore();
  }

  // Draw rotating 6-segment planet
  const slice=Math.PI*2/6;
  for(let i=0;i<6;i++){
    const a0=wheelAng+i*slice,a1=a0+slice,amid=a0+slice/2;
    ctx.save();
    ctx.fillStyle=SEGS[i].col;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,planetR,a0,a1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.stroke();

    const sx=cx+Math.cos(amid)*(planetR*0.68);
    const sy=cy+Math.sin(amid)*(planetR*0.68);
    ctx.translate(sx,sy);
    ctx.rotate(amid+Math.PI/2);
    ctx.drawImage(SEGS[i].img,-22,-22,44,44);
    ctx.restore();
  }

  // Planet core
  ctx.save();
  ctx.fillStyle='#1B1438';ctx.strokeStyle='#FFD93D';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(cx,cy,planetR*0.32,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.drawImage(imgRainbow,cx-22,cy-22,44,44);
  ctx.restore();

  OC.fx.update(ctx,dt);
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
