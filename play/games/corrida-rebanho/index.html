<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrida do Rebanho</title><script src="../../oc.js"></script></head><body>
<canvas id="c"></canvas>
<div class="hud"><span id="hp">1.º Lugar</span><span id="hd">0%</span></div>
<div class="ov" id="ov"><h2>🏁 Corrida do Rebanho</h2>
<p>Corre nas 4 pistas arco-íris contra 3 ovelhas rivais!<br>
⬆️⬇️ <b>Setas / W S</b> ou <b>toca na pista</b> para mudares de faixa. Apanha ⚡ <b>turbos</b> e 🥜 <b>amendoins</b>, e desvia-te das barreiras 🚧 e poças de lama!</p>
<button class="btn" id="go">▶ Começar Corrida</button></div>
<script>
const W=800,H=460,cv=document.getElementById('c'),x=cv.getContext('2d'),P=OC.fit(cv,W,H);
const ID='corrida-rebanho',$=id=>document.getElementById(id);
let GOAL=4200;
const IM=OC.SHEEP.map(n=>OC.img('ovelha-'+n));
const LANES=[165,235,305,375];
let racers,objs,parts,running=false,over=false,t=0,stars=[];
for(let i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*130,Math.random()*1.5+.3]);
function init(){
 const campLv=(OC.diff&&OC.diff.level)||1;
 GOAL=3800+campLv*180;
 const aiScale=0.96+Math.min(0.16,campLv*0.002);
 over=false;parts=[];objs=[];
 racers=[
  {x:0,lane:1,y:LANES[1],v:230,c:0,boost:0,stun:0,pl:true,name:'Tu'},
  {x:0,lane:0,y:LANES[0],v:225,c:1,boost:0,stun:0,ai:1*aiScale,name:'Ovelha Azul'},
  {x:0,lane:2,y:LANES[2],v:228,c:3,boost:0,stun:0,ai:1.03*aiScale,name:'Ovelha Verde'},
  {x:0,lane:3,y:LANES[3],v:232,c:5,boost:0,stun:0,ai:1.06*aiScale,name:'Ovelha Laranja'}
 ];
 for(let px=320;px<GOAL-180;px+=135){
  const l=Math.floor(Math.random()*4),r=Math.random();
  objs.push({x:px,lane:l,k:r<.42?'rock':r<.72?'pad':'nut'});
  if(Math.random()<.45)objs.push({x:px+55,lane:(l+2)%4,k:Math.random()<.5?'rock':'pad'});
 }
}
function changeLane(r,dl){r.lane=Math.max(0,Math.min(3,r.lane+dl));if(r.pl)OC.tone(420,.05,'sine',.06)}
function update(dt){
 t+=dt;if(!running||over)return;
 const pl=racers[0];
 for(const r of racers){
  if(r.boost>0)r.boost-=dt;if(r.stun>0)r.stun-=dt;
  const targetV=(r.pl?252:242*r.ai)+(r.boost>0?140:0)-(r.stun>0?130:0);
  r.v+=(targetV-r.v)*dt*4;
  r.x+=r.v*dt;
  r.y+=(LANES[r.lane]-r.y)*Math.min(1,dt*12);
  // IA simples: olha em frente na sua faixa
  if(!r.pl&&Math.random()<dt*5){
   const danger=objs.find(o=>!o.hit&&o.k==='rock'&&o.lane===r.lane&&o.x>r.x+20&&o.x<r.x+140);
   if(danger)changeLane(r,Math.random()<.5?1:-1);
  }
  for(const o of objs){
   if(o.hit||o.lane!==r.lane||Math.abs(o.x-r.x)>24)continue;
   if(o.k==='rock'){o.hit=true;r.stun=.9;r.boost=0;if(r.pl)OC.sfx.bad()}
   else if(o.k==='pad'){r.boost=1.4;if(r.pl){OC.sfx.jump();for(let i=0;i<10;i++)parts.push({x:r.x,y:r.y,vx:-140,vy:(Math.random()-.5)*80,l:.4,c:'#00f5d4'})}}
   else if(o.k==='nut'){o.hit=true;r.boost=1;if(r.pl)OC.sfx.good()}
  }
  if(r.x>=GOAL&&!r.fin)r.fin=t;
 }
 const rank=1+racers.filter(r=>r!==pl&&r.x>pl.x).length;
 $('hp').textContent=`${rank}.º Lugar`;$('hd').textContent=Math.min(100,Math.floor(pl.x/GOAL*100))+'%';
 if(pl.x>=GOAL){
  over=true;running=false;
  const st=rank===1?8:rank===2?5:3;OC.best(ID,Math.max(OC.best(ID),5-rank));
  setTimeout(()=>OC.end({id:ID,title:rank===1?'🥇 Campeão da Pista!':`${rank}.º Lugar na Meta!`,text:rank===1?'Deixaste todo o rebanho a comer poeira cósmica!':'Boa corrida! Tenta apanhar mais turbos para o 1.º lugar.',stars:st,retry:()=>{init();running=true}}),500);
 }
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
}
function draw(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b102d');g.addColorStop(.32,'#2d1a5e');g.addColorStop(.33,'#1a2456');g.addColorStop(1,'#11173b');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff';stars.forEach(s=>{x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()});
 const camX=racers[0].x-150;
 // pistas
 const cols=['#ff85a233','#4cc9f033','#06d6a033','#ffd16633'];
 LANES.forEach((ly,i)=>{
  x.fillStyle=cols[i];x.fillRect(0,ly-32,W,64);
  x.strokeStyle='#ffffff2a';x.lineWidth=2;x.beginPath();x.moveTo(0,ly+32);x.lineTo(W,ly+32);x.stroke();
 });
 x.save();x.translate(-camX,0);
 // linha de meta
 x.fillStyle='#fff';for(let r=0;r<18;r++)for(let c=0;c<2;c++){x.fillStyle=(r+c)%2?'#fff':'#111';x.fillRect(GOAL+c*16,133+r*16,16,16)}
 // objetos
 x.textAlign='center';x.textBaseline='middle';x.font='30px sans-serif';
 for(const o of objs){
  if(o.hit||o.x<camX-60||o.x>camX+W+60)continue;
  const ly=LANES[o.lane];
  if(o.k==='rock')x.fillText('🚧',o.x,ly);
  else if(o.k==='pad'){x.fillStyle='#00f5d4';x.beginPath();x.roundRect(o.x-22,ly-16,44,32,8);x.fill();x.fillText('⚡',o.x,ly)}
  else x.fillText('🥜',o.x,ly);
 }
 // corredores
 [...racers].sort((a,b)=>a.y-b.y).forEach(r=>{
  const bob=Math.abs(Math.sin(t*14+r.c))*6,im=IM[r.c];
  if(r.boost>0){x.fillStyle='#00f5d488';x.beginPath();x.ellipse(r.x-24,r.y,18,8,0,0,7);x.fill()}
  if(im.complete)x.drawImage(im,r.x-28,r.y-34-bob,56,56);
  if(r.pl){x.fillStyle='#ffd166';x.font='700 13px Fredoka,sans-serif';x.fillText('▼ TU',r.x,r.y-42-bob)}
 });
 parts.forEach(p=>{x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill()});
 x.restore();
}
addEventListener('keydown',e=>{
 if(!running||over)return;
 if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();changeLane(racers[0],-1)}
 if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();changeLane(racers[0],1)}
});
cv.addEventListener('pointerdown',e=>{
 if(!running||over)return;const py=P(e).y;
 let bestL=0,bd=999;LANES.forEach((ly,i)=>{if(Math.abs(py-ly)<bd){bd=Math.abs(py-ly);bestL=i}});
 racers[0].lane=bestL;OC.tone(420,.05,'sine',.06);
});
init();
let last=performance.now();
(function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
$('go').onclick=()=>{$('ov').style.display='none';running=true};
</script></body></html>
