  .pod .md{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 46px 'Fredoka';flex:none;background:#ffffff;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:1}

  .pod .sc{display:inline-flex;align-items:baseline;gap:6px;margin-top:12px;background:rgba(10,16,46,.15);padding:6px 22px;border-radius:24px;border:2px solid rgba(255,255,255,.4);backdrop-filter:blur(4px)}

  .pod.p1{height:470px;background:linear-gradient(180deg,#fff4b8 0%,#ffc745 40%,#f59e0b 100%);animation-delay:1.4s;z-index:3;border:3px solid rgba(255,255,255,.9)}
  .pod.p2{height:360px;background:linear-gradient(180deg,#ffffff 0%,#e2e8f0 40%,#94a3b8 100%);animation-delay:.8s;z-index:2;border:3px solid rgba(255,255,255,.9)}

  @keyframes rise{from{transform:translateY(600px)}}
  
  .podium-floor{width:1160px;height:36px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,209,102,.4) 0%,rgba(155,93,229,.25) 45%,rgba(10,14,39,0) 70%);margin-top:-18px;margin-bottom:28px;z-index:1;filter:blur(4px);pointer-events:none}

<body>
<canvas id="stars"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlcDw00v_Jcat_KApXCbS_uRbpSSIObko",
  authDomain: "ovelhascoloridas-235c1.firebaseapp.com",
  projectId: "ovelhascoloridas-235c1",
  storageBucket: "ovelhascoloridas-235c1.firebasestorage.app",
  messagingSenderId: "791349999782",
  appId: "1:791349999782:web:5bce745534725f29691c67"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ref = db.collection('quiz').doc('main');

const MASCOT = 'personagens/ovelha-arcoiris-standart.png';
const LETTERS = ['A','B','C','D'];
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `scale(${s})`;
  stage.style.left = (innerWidth-1920*s)/2+'px';
  stage.style.top  = (innerHeight-1080*s)/2+'px';
  for(const c of [$('stars'),$('fx')]){ c.width=innerWidth; c.height=innerHeight; }
}
addEventListener('resize', fit); fit();

/* ───── Fundo: Estrelas ───── */
(function(){
  const c=$('stars'), x=c.getContext('2d'); let stars=[], shoot=null;
  const mk=()=>{ stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2+.4,p:Math.random()*6.28,s:.4+Math.random()*1.4})); };
  mk(); addEventListener('resize',mk);
  (function loop(t){
    x.clearRect(0,0,c.width,c.height);
    for(const s of stars){ x.globalAlpha=.25+.55*Math.abs(Math.sin(t/1000*s.s+s.p)); x.fillStyle='#fff'; x.beginPath(); x.arc(s.x*c.width,s.y*c.height,s.r,0,6.28); x.fill(); }
    if(!shoot && Math.random()<.003) shoot={x:Math.random()*c.width*.8,y:Math.random()*c.height*.4,l:0};
    if(shoot){ shoot.l+=14; const a=Math.max(0,1-shoot.l/420); x.globalAlpha=a; x.strokeStyle='#fff'; x.lineWidth=3; x.beginPath();
      x.moveTo(shoot.x+shoot.l,shoot.y+shoot.l*.55); x.lineTo(shoot.x+shoot.l-120,shoot.y+(shoot.l-120)*.55); x.stroke(); if(a<=0) shoot=null; }
    requestAnimationFrame(loop);
  })(0);
})();

/* ───── Confetti (Final) ───── */
function confetti(ms=9000){
  const c=$('fx'), x=c.getContext('2d'), end=Date.now()+ms, cols=['#ffd166','#ff4a4a','#7ee564','#6a97ff','#d8b4fe','#fff'];
  const P=Array.from({length:240},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,vy:3+Math.random()*5,vx:(Math.random()-.5)*3,w:8+Math.random()*10,h:14+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    if(Date.now()>end){ return; }
    for(const p of P){ p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/60); p.r+=p.vr; if(p.y>c.height) p.y=-20;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); }
    requestAnimationFrame(f);
  })();
}

/* ───── Imagens Cache ───── */
const imgCache = {};
function imgSrc(r){
  if(!r) return '';
  if(!r.startsWith('media:')) return r;
  const id=r.slice(6);
  if(id in imgCache) return imgCache[id]==='loading' ? '' : imgCache[id];
  imgCache[id]='loading';
  db.collection('quiz_media_data').doc(id).get().then(d=>{ imgCache[id]=d.exists?d.data().data:''; render(); }).catch(()=>{ imgCache[id]=''; });
  return '';
}

/* ───── Classificação ───── */
let S=null, view=null, timerInt=null;

function ranking(){
  const sc=S.scores||{}, aw=S.awarded||{};
  const r=(S.teams||[]).map(t=>({...t,score:sc[t.id]||0,gain:aw[t.id]||0})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  r.forEach((t,i)=>{ t.rank = i>0&&r[i-1].score===t.score ? r[i-1].rank : i+1; });
  return r;
}
function tween(el,to){
  const from=+el.dataset.v||0; el.dataset.v=to; const tok=el._tk=(el._tk||0)+1;
  if(from===to){ el.textContent=to; return; }
  const t0=performance.now();
  (function f(t){ if(el._tk!==tok) return; const k=Math.min(1,(t-t0)/1000);
    el.textContent=Math.round(from+(to-from)*k*(2-k)); if(k<1) requestAnimationFrame(f); })(t0);
}
function syncBoard(cont, rows, rowH, gap, showGain){
  cont.style.setProperty('--h',(rowH-gap)+'px');
  cont.style.height=(rows.length*rowH)+'px';
  const seen=new Set();
  rows.forEach((t,i)=>{
    seen.add(t.id);
    let el=cont.querySelector(`[data-id="${t.id}"]`);
    if(!el){
      el=document.createElement('div'); el.className='brow'; el.dataset.id=t.id;
      el.innerHTML='<div class="rk"></div><div class="nm"></div><div class="gn"></div><div class="sc">0</div>';
      el.style.top=(i*rowH+40)+'px'; el.style.opacity=0; cont.appendChild(el); void el.offsetWidth;
    }
    el.className='brow'+(t.rank<=3?' r'+t.rank:'');
    el.style.top=(i*rowH)+'px'; el.style.opacity=1;
    el.querySelector('.rk').textContent=t.rank;
    el.querySelector('.nm').textContent=t.name;
    el.querySelector('.gn').textContent=showGain&&t.gain>0?'+'+t.gain:'';
    tween(el.querySelector('.sc'),t.score);
  });
  [...cont.children].forEach(e=>{ if(!seen.has(e.dataset.id)) e.remove(); });
}

function setView(key, html){ if(view===key) return false; view=key; stage.innerHTML=html; return true; }

function hero(extra=''){
  return `<div class="hero">
    <img class="mascot" src="${MASCOT}" alt="Ovelha Arco-Íris">
    <h1 class="title"><img class="logo" src="titulo-logo.png" alt="Ovelhas Coloridas: Uma Aventura no Espaço"></h1>
    ${extra}
  </div>`;
}

function render(){
  if(!S){ setView('loading', hero()); return; }
  if(!S.live){ stopTimer(); setView('standby', hero()); return; }
  const q=(S.questions||[])[S.qIndex], phase=S.phase;

  if(phase==='lobby' || (!q && (phase==='question'||phase==='reveal'))){
    stopTimer();
    const teams=(S.teams||[]).map((t,i)=>`<div style="animation-delay:${.1+i*.08}s">${esc(t.name)}</div>`).join('');
    setView('lobby|'+(S.runId)+'|'+JSON.stringify(S.teams), hero(teams?`<div class="chips-row">${teams}</div>`:''));
    return;
  }

  if(phase==='board'){
    stopTimer();
    const r=ranking(), rowH=Math.min(100, Math.floor(640/Math.max(r.length,1)));
    if(setView('board', `<div class="page"><h2>Classificação</h2><div class="after">Após a pergunta ${S.qIndex+1}</div><div class="list big" id="bl"></div></div>`)){
      requestAnimationFrame(()=>syncBoard($('bl'),ranking(),rowH,14,true));
    } else syncBoard($('bl'),r,rowH,14,true);
    return;
  }

  if(phase==='final'){
    stopTimer(); const r=ranking();
    const key='final|'+JSON.stringify(r.map(t=>[t.name,t.score]));
    const labels=['1.º LUGAR','2.º LUGAR','3.º LUGAR'];
    const pod=(i,pos,cls)=>r[i]?`<div class="pod ${cls}">
      <div class="md">${pos}</div>
      <div class="pod-place">${labels[pos-1]}</div>
      <div class="nm">${esc(r[i].name)}</div>
      <div class="sc"><span class="pts-num">${(r[i].score||0).toLocaleString('pt-PT')}</span> <span class="pts-lbl">PTS</span></div>
    </div>`:'';
    if(setView(key, `<div class="page podium-wrap">
      <h2>Pódio dos Vencedores</h2>
      <div class="after">Parabéns a todos os participantes!</div>
      <div class="podium">${pod(1,2,'p2')}${pod(0,1,'p1')}${pod(2,3,'p3')}</div>
      <div class="podium-floor"></div>
      ${r.length>3?`<div class="rest">${r.slice(3).map((t,idx)=>`<div class="rest-chip"><span class="rk-tag">${idx+4}º</span> <span class="nm-txt">${esc(t.name)}</span> <span class="sc-txt">${(t.score||0).toLocaleString('pt-PT')} pts</span></div>`).join('')}</div>`:''}
    </div>`)) confetti();
    return;
  }

  // Pergunta / Revelação
  const key=`q|${S.qIndex}|${S.runId}|${JSON.stringify([q.text,q.answers,S.questions.length])}`;
  const built = setView(key, buildQuestion(q));
  updateQuestion(q, phase==='reveal', built);
}

function buildQuestion(q){
  const n=S.questions.length, i=S.qIndex+1, len=q.text.length, cls=len>90?'vlong':len>55?'long':'';
  const ans=(q.answers||[]).slice(0,4), mult=q.pointsMode==='double'?2:1;
  return `<div id="qroot">
    <div id="qbanner">
      <div class="tag">Pergunta ${i} <span>de ${n}</span></div>
      <div class="qt ${cls}">${esc(q.text)}</div>
      <div class="prog" id="qprog"><i id="qbar" style="width:100%"></i></div>
    </div>
    <div id="timer-num" style="display:${q.time>0?'block':'none'}">${q.time}</div>
    ${mult===2?'<div id="badge">✦ Pontos a dobrar</div>':''}
    <div id="center"></div>
    <div id="expl"></div>
    ${ans.map((a,k)=>`<div class="ans outline ${a.length>22&&ans.length>2?'small':''}" data-i="${k}" data-n="${ans.length}">
      <div class="lt" style="-webkit-text-stroke:0">${LETTERS[k]}</div><span class="t">${esc(a)}</span><div class="chips"></div><div class="mark" style="-webkit-text-stroke:0">✓</div></div>`).join('')}
    <div id="panel"><div class="ph">Classificação</div><div class="list" id="pl"></div></div></div>`;
}

function updateQuestion(q, reveal, built){
  const root=$('qroot'); root.classList.toggle('reveal',reveal);
  const picks=S.picks||{}, byId={}; (S.teams||[]).forEach(t=>byId[t.id]=t);

  // Foto (se existir)
  const src=imgSrc(q.image), c=$('center');
  if(src){
    c.style.display='flex';
    if(c.dataset.cur!==src){ c.dataset.cur=src; c.innerHTML=`<img class="photo" src="${esc(src)}" alt="">`; }
  } else {
    c.style.display='none'; c.innerHTML=''; delete c.dataset.cur;
  }

  // Explicação
  const ex=$('expl'); ex.textContent=q.explanation||''; ex.classList.toggle('on',reveal&&!!q.explanation);
  if(reveal&&q.explanation&&src) $('center').style.opacity=.15; else if(src) $('center').style.opacity=1;

  // Respostas
  document.querySelectorAll('.ans').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('correct',reveal&&i===q.correct);
    el.classList.toggle('dim',reveal&&i!==q.correct);
    const ch=el.querySelector('.chips'), names=reveal?Object.keys(picks).filter(id=>picks[id]===i&&byId[id]).map(id=>byId[id].name):[];
    const sig=names.join('|'); if(ch.dataset.sig!==sig){ ch.dataset.sig=sig; ch.innerHTML=names.map(n=>`<div class="chip">${esc(n)}</div>`).join(''); }
  });

  // Classificação Lateral
  const r=ranking(); syncBoard($('pl'), r, Math.min(68, Math.floor(700/Math.max(r.length,1))), 8, reveal);

  // Cronómetro Sincronizado
  const tm=$('timer-num'), bar=$('qbar'), prog=$('qprog');
  if(!reveal && S.phase==='question' && q.time>0){
    if(tm) tm.style.display='block';
    if(prog) prog.style.display='block';
    startTimer();
  } else {
    stopTimer();
    if(tm) tm.style.display='none';
    if(bar) bar.style.width='100%';
    if(prog){ prog.classList.remove('low'); prog.classList.remove('paused'); }
  }
}

function startTimer(){
  if(timerInt) return;
  const tick=()=>{
    const tm=$('timer-num'), bar=$('qbar'), prog=$('qprog');
    if(!S || S.phase!=='question'){ stopTimer(); return; }

    const isPaused = S.timerPaused === true;
    const total = S.timerTotal || (curQ() ? curQ().time : 20);
    let left = 0;

    if(isPaused){
      left = Math.max(0, S.timerRemaining ?? total);
    } else {
      const end = S.timerEnd || (Date.now() + total * 1000);
      left = Math.max(0, (end - Date.now()) / 1000);
    }

    const ratio = total > 0 ? left / total : 0;

    const isLow = !isPaused && left <= 5 && left > 0;
    if(tm){
      tm.textContent = Math.ceil(left);
      tm.classList.toggle('paused', isPaused);
      tm.classList.toggle('low', isLow);
    }
    if(bar) bar.style.width = (ratio * 100) + '%';
    if(prog){
      prog.classList.toggle('paused', isPaused);
      prog.classList.toggle('low', isLow);
    }
    const qb = $('qbanner');
    if(qb) qb.classList.toggle('low', isLow);

    if(left <= 0 && !isPaused){
      stopTimer();
    }
  };
  tick(); timerInt=setInterval(tick,100);
}
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }

ref.onSnapshot(doc=>{ S=doc.exists?doc.data():{live:false}; render(); },
  err=>{ stage.innerHTML=`<div class="hero"><div class="title" style="color:#ff7a7a">Erro de ligação: ${esc(err.message)}</div></div>`; });
render();
</script>
